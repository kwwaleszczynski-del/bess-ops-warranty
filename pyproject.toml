[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bess-ops-warranty"
version = "0.1.0"
description = "Operational monitoring of a grid battery against its warranty and LTSA: metered round-trip efficiency with auxiliaries, contractual availability, cycles and warranty conditions, capacity tests and SoH forecast, monthly Excel/HTML report; benchmarked on every battery of Australia's NEM."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Konrad Waleszczyński" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
bess-ops = "bess_ops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bess_ops = ["examples/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
